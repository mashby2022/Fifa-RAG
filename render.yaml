services:
  - type: web
    name: worldcup-rag-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/ingest_dataset.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: VECTOR_BACKEND
        value: memory
      - key: EMBEDDING_PROVIDER
        value: nvidia
      - key: GENERATOR_PROVIDER
        value: nvidia
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_EMBEDDING_MODEL
        value: nvidia/nv-embedqa-e5-v5
      - key: NVIDIA_GENERATOR_MODEL
        value: meta/llama-3.1-70b-instruct
      - key: NVIDIA_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
